definitions:
  enums.LogAction:
    enum:
    - register
    - login
    - logout
    - enter_room
    - exit_room
    - join_challenge
    - challenge_result
    type: string
    x-enum-varnames:
    - LogActionRegister
    - LogActionLogin
    - LogActionLogout
    - LogActionEnterRoom
    - LogActionExitRoom
    - LogActionJoinChallenge
    - LogActionChallengeResult
  enums.PaymentMethod:
    enum:
    - credit_card
    - bank_transfer
    - third_party
    - blockchain
    type: string
    x-enum-varnames:
    - PaymentMethodCreditCard
    - PaymentMethodBankTransfer
    - PaymentMethodThirdParty
    - PaymentMethodBlockchain
  enums.RoomStatus:
    enum:
    - available
    - unavailable
    - maintenance
    type: string
    x-enum-varnames:
    - RoomStatusAvailable
    - RoomStatusUnavailable
    - RoomStatusMaintenance
  models.ChallengeRequest:
    properties:
      playerId:
        type: string
    type: object
  models.CreateChallengeGameRequest:
    properties:
      addWinProbability:
        type: number
      challengeCost:
        type: number
      challengeTimeCostSec:
        type: integer
      challengeTimeDurationSec:
        type: integer
      winProbability:
        type: number
    required:
    - addWinProbability
    - challengeCost
    - challengeTimeCostSec
    - challengeTimeDurationSec
    - winProbability
    type: object
  models.LevelRequest:
    properties:
      name:
        type: string
    type: object
  models.LogRequest:
    properties:
      action:
        $ref: '#/definitions/enums.LogAction'
      details:
        type: string
      playerId:
        type: string
    required:
    - action
    - playerId
    type: object
  models.PaymentRequest:
    properties:
      amount:
        type: number
      paymentMethod:
        $ref: '#/definitions/enums.PaymentMethod'
      playerId:
        type: string
    required:
    - amount
    - paymentMethod
    - playerId
    type: object
  models.PlayerRequest:
    properties:
      balance:
        type: number
      challengeCount:
        type: integer
      levelId:
        type: string
      name:
        type: string
    required:
    - levelId
    - name
    type: object
  models.ReservationRequest:
    properties:
      bookingDatetime:
        type: string
      playerIds:
        items:
          type: string
        type: array
      roomId:
        type: string
    type: object
  models.Response:
    properties:
      data:
        additionalProperties: {}
        type: object
      message:
        type: string
      success:
        type: boolean
    type: object
  models.RoomRequest:
    properties:
      description:
        type: string
      name:
        type: string
      status:
        $ref: '#/definitions/enums.RoomStatus'
    type: object
  models.UpdateChallengeGameRequest:
    properties:
      addWinProbability:
        type: number
      challengeCost:
        type: number
      challengeTimeCostSec:
        type: integer
      challengeTimeDurationSec:
        type: integer
      winProbability:
        type: number
    type: object
